version: '3.8'
services:
  frontend:
    build: ./Frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=development
      # Update with your MongoDB URI or start a mongo container
      - MONGODB_URI=mongodb://mongo:27017/finchatbot
      - PYTHON_SERVICE_URL=http://python-backend:5000
      - CORS_ORIGIN=http://localhost
      - JWT_ACCESS_SECRET=your_super_secret_access_key
      - JWT_REFRESH_SECRET=your_super_secret_refresh_key
    depends_on:
      - mongo
      - python-backend

  python-backend:
    build: ./Python-Backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - LLM_MODEL=llama-3.1-8b-instant
      - USE_PINECONE=false
      - NODE_WEBHOOK_URL=http://backend:8000
      # You MUST provide a GROQ_API_KEY for this to work
      - GROQ_API_KEY=${GROQ_API_KEY}
    
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
